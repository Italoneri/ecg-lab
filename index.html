<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECG Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3f6;--surface:#ffffff;--text:#14181f;--muted:#5c6675;--border:#dde2ea;
  --accent:#d1123f;--accent-soft:rgba(209,18,63,.10);--good:#12805a;--good-soft:rgba(18,128,90,.12);
  --bad:#d1123f;--bad-soft:rgba(209,18,63,.10);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1218;--surface:#171d26;--text:#eef1f5;--muted:#93a0b2;--border:#263041;
    --accent:#ff5d7d;--accent-soft:rgba(255,93,125,.14);--good:#3ecf9a;--good-soft:rgba(62,207,154,.14);
    --bad:#ff5d7d;--bad-soft:rgba(255,93,125,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1218;--surface:#171d26;--text:#eef1f5;--muted:#93a0b2;--border:#263041;
  --accent:#ff5d7d;--accent-soft:rgba(255,93,125,.14);--good:#3ecf9a;--good-soft:rgba(62,207,154,.14);
  --bad:#ff5d7d;--bad-soft:rgba(255,93,125,.14);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-bottom:92px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{padding:18px 0 6px}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:26px;letter-spacing:-.02em}
.badge{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:var(--surface)}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
section.tab{padding-top:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:6px}
.card p.lead{color:var(--muted);font-size:14.5px}

/* papel ECG */
.paper{border-radius:12px;overflow:hidden;border:1px solid #e3b7b4;background:#fff7f5;line-height:0}
.paper canvas{display:block;max-width:none}
#papelWrap canvas{touch-action:none;cursor:ew-resize}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid #e3b7b4;background:#fff7f5;line-height:0}
.scroller canvas{display:block}
.zview{overflow:hidden;position:relative;border-radius:12px;border:1px solid #e3b7b4;background:#fff7f5;line-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.zview canvas{display:block;max-width:none}
.zview.pannable,.zview.pannable canvas{cursor:grab}
.zview.pannable.grabbing,.zview.pannable.grabbing canvas{cursor:grabbing}
.zview.measure,.zview.measure canvas{cursor:crosshair}
#papelWrap.zview:not(.zoomed) canvas{cursor:ew-resize}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

/* controles */
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font-family:inherit;font-size:15px;color:var(--text);cursor:pointer}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:12px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}

.readout{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:15px}
.readout b{font-family:var(--font-display);font-size:20px}
.readout .small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{border:1px solid var(--border);border-radius:14px;padding:12px}
.fact b{display:block;font-family:var(--font-display);font-size:18px;color:var(--accent);margin-bottom:2px}
.fact span{font-size:13.5px;color:var(--muted)}
.rule{display:flex;gap:6px;margin-top:12px}
.rule div{flex:1;text-align:center;border-radius:10px;border:1px solid var(--border);padding:8px 0}
.rule b{display:block;font-family:var(--font-display);font-size:17px}
.rule span{font-size:12px;color:var(--muted)}

.info h3{font-size:20px;margin-bottom:4px}
.info .norm{display:inline-block;font-size:13.5px;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:8px;padding:3px 10px;margin:4px 0 10px}
.info p{font-size:15px;margin-bottom:8px}
.info .measured{color:var(--muted);font-size:14px}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:15px}
ol.steps li{margin-bottom:4px}

/* quiz */
.statbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px}
.statbar b{color:var(--text)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;line-height:1.3}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.fb{margin-top:14px}
.fb h3{font-size:20px;margin-bottom:8px}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}
.fb ul{margin:0 0 10px;padding-left:20px;font-size:15px}
.fb li{margin-bottom:4px}
.fb .fc{font-size:14px;color:var(--muted);margin-bottom:12px}
.weak{font-size:13.5px;color:var(--muted);margin-top:10px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px 0;min-height:36px}
.linkbtn.report{display:block;margin:8px auto 0;font-size:13.5px}
.linkbtn.report::before{content:"⚑ ";text-decoration:none;display:inline-block;margin-right:4px}
.disc{font-size:12.5px;color:var(--muted);text-align:center;padding:6px 8px 0}

/* barra de abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{stroke-width:2.3}
/* casos reais */
.sessbar{display:flex;gap:4px;margin-bottom:14px}
.sessbar span{flex:1;height:6px;border-radius:99px;background:var(--border)}
.sessbar span.ok{background:var(--good)}
.sessbar span.no{background:var(--bad)}
.sessbar span.cur{background:var(--accent);opacity:.45}
.qprompt{font-size:21px}
.zoomrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.zoomrow input{flex:1;accent-color:var(--accent);min-width:60px}
.iconbtn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px}
.opt .l{flex:0 0 auto;font-family:var(--font-display);font-size:19px;width:22px;color:var(--muted)}
.opt.correct .l{color:var(--good)}
.opt.wrong .l{color:var(--bad)}
.explrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.explbtn{background:none;border:none;padding:6px 0;min-height:44px;font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:8px}
.explbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.nextbar{position:static;padding:0;margin:12px 0 0}
.nextbar .btn{width:100%;min-height:52px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.nextbar .btn.soft{background:var(--surface);color:var(--text);border-color:var(--border)}
.sumbig{font-family:var(--font-display);font-size:44px;line-height:1;margin:10px 0 4px}
.sumlist{list-style:none;padding:0;margin:14px 0}
.sumlist li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:14.5px}
.sumlist .mk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.sumlist .mk.ok{background:var(--good)}
.sumlist .mk.no{background:var(--bad)}
.sumlist small{display:block;color:var(--muted)}
.full{position:fixed;inset:0;z-index:50;background:var(--bg)}
.fin{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;gap:6px;padding:8px calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
.full.rot .fin{transform:rotate(90deg) translateY(-100%);transform-origin:top left;padding:8px}
.fbar{display:flex;align-items:center;gap:8px}
.fbar input{flex:1;accent-color:var(--accent);max-width:360px}
.ftitle{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fread{flex:1;text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fscroll{flex:1;min-height:0;overflow:hidden;touch-action:none;border:1px solid #e3b7b4;border-radius:10px;background:#fff7f5;line-height:0;cursor:grab}
.fscroll.measure{cursor:crosshair}
.fscroll canvas{display:block}
.src{font-size:12.5px;color:var(--muted);margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 10px}
.tools .btn{min-height:40px;padding:0 12px;font-size:14px}
.tools .sp{flex:1}
.scroller.measure canvas{touch-action:none;cursor:crosshair}
.laudo{margin:0 0 10px;padding-left:20px;font-size:15px}
.laudo li{margin-bottom:3px}
.laudo .poss{color:var(--muted)}
.orig{font-size:13px;color:var(--muted);margin-bottom:12px;font-style:italic}
.srcbar{display:flex;gap:8px;margin-bottom:10px}
.bankinfo{font-size:14.5px;margin:6px 0 10px}
details.how{margin-top:10px;font-size:14.5px}
details.how summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
details.how ol{padding-left:20px;margin:6px 0}
details.how li{margin-bottom:5px}
.prog{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:10px}
.prog div{height:100%;width:0;background:var(--accent);transition:width .2s}
.progtxt{font-size:13.5px;color:var(--muted);margin-top:6px}
.credits{font-size:12.5px;color:var(--muted);line-height:1.45}
.credits p{margin-bottom:6px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* cabeçalho e idioma */
.lang{display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.lang button{border:none;background:none;min-width:44px;min-height:34px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.lang button.on{background:var(--accent);color:#fff}
/* sub-abas de Aprender */
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;min-height:40px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
/* galeria */
.galcat{font-size:17px;margin:18px 0 8px}
.galcat:first-child{margin-top:4px}
.gallist{display:grid;gap:8px}
.galrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-weight:600;line-height:1.3}
.galrow:active{transform:scale(.99)}
.tag{flex:0 0 auto;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.tag.f1{color:var(--good);background:var(--good-soft);border-color:transparent}
.tag.f3{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.backbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:15px;min-height:44px;padding:0;display:inline-flex;align-items:center;gap:6px}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.dsec{font-size:16px;margin:16px 0 6px}
.dlist{margin:0;padding-left:20px;font-size:15px}
.dlist li{margin-bottom:4px}
.dnav{display:flex;gap:8px;margin-top:16px}
.dnav .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row">
      <h1>ECG Lab</h1>
      <div class="lang" role="group" aria-label="Idioma / Idioma">
        <button data-lang="pt">PT</button><button data-lang="es">ES</button>
      </div>
    </div>
    <p class="sub" data-t="sub"></p>
  </header>

  <!-- ABA APRENDER -->
  <section class="tab" id="tab-aprender">
    <div class="seg" role="tablist">
      <button data-sub="papel" data-t="seg_paper"></button>
      <button data-sub="normal" data-t="seg_normal"></button>
      <button data-sub="achados" data-t="seg_find"></button>
    </div>

    <div id="sub-papel">
      <div class="card">
        <h2 data-t="paper_h"></h2>
        <p class="lead" data-t="paper_lead"></p>
        <div style="height:12px"></div>
        <div class="paper fit" id="papelWrap"><canvas id="cvPapel"></canvas></div>
        <div class="zoomrow"><button class="iconbtn" id="zPapelOut" data-ta="zoom_out">−</button><input type="range" id="zPapel" min="0" max="100" value="0" data-ta="zoom"><button class="iconbtn" id="zPapelIn" data-ta="zoom_in">+</button></div>
        <div class="btnrow">
          <button class="btn" data-m="rr">R–R</button>
          <button class="btn" data-m="pr">PR</button>
          <button class="btn" data-m="qrs">QRS</button>
          <button class="btn ghost" id="btnNovo" data-t="new_trace"></button>
        </div>
        <div class="readout" id="readPapel"></div>
      </div>
      <div class="card">
        <h2 data-t="paper4_h"></h2>
        <div class="facts">
          <div class="fact"><b>1 mm</b><span data-t="f1"></span></div>
          <div class="fact"><b>5 mm</b><span data-t="f2"></span></div>
          <div class="fact"><b>25 mm/s</b><span data-t="f3"></span></div>
          <div class="fact"><b>10 mm/mV</b><span data-t="f4"></span></div>
        </div>
        <h2 style="margin-top:18px;font-size:17px" data-t="hr_h"></h2>
        <p class="lead" data-t="hr_lead"></p>
        <div class="rule">
          <div><b>1</b><span>300</span></div><div><b>2</b><span>150</span></div><div><b>3</b><span>100</span></div>
          <div><b>4</b><span>75</span></div><div><b>5</b><span>60</span></div><div><b>6</b><span>50</span></div>
        </div>
        <p class="hint" data-t="hr_hint"></p>
      </div>
    </div>

    <div id="sub-normal" hidden>
      <div class="card">
        <h2 data-t="norm_h"></h2>
        <p class="lead" data-t="norm_lead"></p>
        <div style="height:12px"></div>
        <div class="paper fit" id="normalWrap"><canvas id="cvNormal"></canvas></div>
        <div class="zoomrow"><button class="iconbtn" id="zNormalOut" data-ta="zoom_out">−</button><input type="range" id="zNormal" min="0" max="100" value="0" data-ta="zoom"><button class="iconbtn" id="zNormalIn" data-ta="zoom_in">+</button></div>
        <div class="chips" id="chipsNormal"></div>
      </div>
      <div class="card info" id="infoNormal"></div>
      <div class="card">
        <h2 data-t="sys_h"></h2>
        <p class="lead" data-t="sys_lead"></p>
        <ol class="steps" data-th="sys_list"></ol>
      </div>
    </div>

    <div id="sub-achados" hidden>
      <div id="galList">
        <p class="lead" data-t="gal_intro" style="margin-bottom:6px"></p>
        <div id="galGroups"></div>
      </div>
      <div id="galDetail" hidden>
        <button class="backbtn" id="galBack">‹ <span data-t="gal_back"></span></button>
        <div class="card">
          <h2 id="gdName"></h2>
          <div class="dtags" id="gdTags"></div>
          <div class="scroller" id="gdScroll"><canvas id="cvGal"></canvas></div>
          <div class="zoomrow"><button class="iconbtn" id="zGalOut" data-ta="zoom_out">−</button><input type="range" id="zGal" min="0" max="100" value="0" data-ta="zoom"><button class="iconbtn" id="zGalIn" data-ta="zoom_in">+</button></div>
          <p class="hint" data-t="swipe"></p>
          <p style="margin-top:12px;font-size:15.5px" id="gdWhat"></p>
          <h3 class="dsec" data-t="gal_crit"></h3>
          <ul class="dlist" id="gdCrit"></ul>
          <h3 class="dsec" data-t="gal_clin"></h3>
          <p style="font-size:15px" id="gdClin"></p>
          <div class="btnrow"><button class="btn" id="gdAgain" data-t="gal_other"></button></div>
          <button class="linkbtn report" id="gdReport" data-t="rep_sim"></button>
          <div class="dnav">
            <button class="btn ghost" id="gdPrev" data-t="gal_prev"></button>
            <button class="btn ghost" id="gdNext" data-t="gal_next"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ABA SIMULADOS -->
  <section class="tab" id="tab-quiz" hidden>
    <div class="statbar"><span id="statText"></span><span id="streakText"></span></div>
    <div class="card">
      <h2 data-t="sim_h"></h2>
      <p class="lead" data-t="sim_lead"></p>
      <div style="height:12px"></div>
      <div class="scroller" id="quizScroll"><canvas id="cvQuiz"></canvas></div>
      <div class="zoomrow"><button class="iconbtn" id="zQuizOut" data-ta="zoom_out">−</button><input type="range" id="zQuiz" min="0" max="100" value="0" data-ta="zoom"><button class="iconbtn" id="zQuizIn" data-ta="zoom_in">+</button></div>
      <p class="hint" data-t="swipe"></p>
      <div class="btnrow"><button class="btn ghost" id="btnDica"></button></div>
      <ul id="dica" hidden style="margin:10px 0 0;padding-left:20px;font-size:14.5px;color:var(--muted)" data-th="guide_list"></ul>
      <div class="opts" id="opts"></div>
      <div class="fb card" id="fb" hidden style="margin-bottom:0"></div>
    </div>
    <div class="weak" id="weak"></div>
    <div style="text-align:center"><button class="linkbtn" id="btnZerar" data-t="reset"></button></div>
  </section>

  <!-- ABA CASOS REAIS -->
  <section class="tab" id="tab-reais" hidden>
    <div class="srcbar" id="srcBar"></div>
    <div class="statbar"><span id="rStat"></span><span id="rStreak"></span></div>
    <div id="rQuiz">

{id:"aivr",cat:"ritmo",f:2,sim:["vt","bav3","junc"],

 crit:{pt:["QRS largo e regular","FC entre 50 e 110 bpm","Sem relação com as ondas P (às vezes dissociação AV ou batimentos de fusão)"],es:["QRS ancho y regular","FC entre 50 y 110 lpm","Sin relación con las ondas P (a veces disociación AV o latidos de fusión)"]},

{id:"bav21",cat:"cond",f:2,sim:["mob1","mob2","bav3"],

{id:"lpfb",cat:"cond",f:3,sim:["lafb","rvh","leadrev"],

{id:"bifasc",cat:"cond",f:2,sim:["rbbb","lafb","lbbb"],

{id:"iam_inf",cat:"isq",f:1,sim:["peric","iam_lat","erepol"],

function vAdd(a,b){return {x:a.x+b.x,y:a.y+b.y,z:a.z+b.z};}
function proj(v,l){
  if(l in LF){var r=LF[l]*Math.PI/180,p=v.x*Math.cos(r)+v.y*Math.sin(r);return l.charAt(0)==="a"?p*0.87:p;}
  var r2=LH[l]*Math.PI/180;return (v.x*Math.cos(r2)+v.z*Math.sin(r2)+0.1*v.y)*GH[l];
}
function E(dur){return {dur:dur,cs:[],ws:[],beats:[],swap:false,gain:1,noise:rnd(0.002,0.006),bw:rnd(0.004,0.02)};}
function C(S,t,s,v){S.cs.push({t:t,s:s,v:v});}
function W(S,f){S.ws.push(f);}
/* platô suave (segmento ST): soma de gaussianas espaçadas */
function PL(S,t0,t1,v){var s=0.016;for(var t=t0+s;t<=t1-s*0.5;t+=s)C(S,t,s,vS(v,0.4));}
var SWAP={II:"III",III:"II",aVR:"aVL",aVL:"aVR"};
function renderE(S,leads){
  var n=Math.round(S.dur*FS),out=[];
  leads.forEach(function(l0){
    var l=S.swap&&SWAP[l0]?SWAP[l0]:l0,sg=(S.swap&&l0==="I")?-1:1,y=new Float32Array(n),i;
    S.cs.forEach(function(c){
      var a=sg*proj(c.v,l)*S.gain;if(Math.abs(a)<1e-4)return;
      var i0=Math.max(0,Math.floor((c.t-4*c.s)*FS)),i1=Math.min(n-1,Math.ceil((c.t+4*c.s)*FS));
      for(i=i0;i<=i1;i++){var d=(i/FS-c.t)/c.s;y[i]+=a*Math.exp(-0.5*d*d);}
    });
    S.ws.forEach(function(f){for(i=0;i<n;i++){var v=f(i/FS);if(v)y[i]+=sg*proj(v,l)*S.gain;}});
    var ph=rnd(0,6.28),ph2=rnd(0,6.28);
    for(i=0;i<n;i++)y[i]+=S.bw*Math.sin(2*Math.PI*0.27*i/FS+ph)+0.4*S.bw*Math.sin(2*Math.PI*0.11*i/FS+ph2)+rnd(-S.noise,S.noise);
    out.push({l:l0,y:y});
  });
  return {dur:S.dur,leads:out,y:out[0].y,beats:S.beats.filter(function(b){return b.tR!=null;})};
}

/* ---- "paciente": eixo, voltagens e intervalos variam a cada traçado ---- */
function heart(o){
  o=o||{};var ax=o.ax!=null?o.ax:rnd(5,80);
  return {ax:ax,m:o.m||rnd(1.0,1.55),z:o.z!=null?o.z:rnd(-0.42,-0.22),
    tax:o.tax!=null?o.tax:Math.max(-10,Math.min(85,ax+rnd(-25,10))),tm:o.tm||rnd(0.22,0.32),tz:o.tz!=null?o.tz:rnd(0.06,0.18),
    pa:o.pa||rnd(0.75,1.15),pr:o.pr||rnd(0.13,0.19),sep:o.sep==null?rnd(0.7,1.2):o.sep,qt:o.qt||1};
}
/* onda P: átrio direito (início) + esquerdo (final) */
function pW(S,t,H,kind){
  var k=H.pa;
  if(kind==="lae"){C(S,t-0.035,0.02,vS(vec(0.03,0.09,0.06),k));C(S,t+0.035,0.024,vS(vec(0.09,0.1,-0.17),k));return;}
  if(kind==="rae"){C(S,t-0.006,0.018,vS(vec(0.04,0.3,0.16),k));C(S,t+0.022,0.02,vS(vec(0.04,0.04,-0.02),k));return;}
  if(kind&&kind.x!=null){C(S,t,0.024,kind);return;}           // P ectópica: vetor próprio
  C(S,t-0.014,0.02,vS(vec(0.035,0.085,0.05),k));C(S,t+0.016,0.02,vS(vec(0.06,0.06,-0.035),k));
}
/* QRS estreito: septal, principal, terminal */
function qN(S,tR,H){
  C(S,tR-0.024,0.008,vS(vec(-0.12,0.03,0.3),H.sep));
  C(S,tR,0.0105,vA(H.ax,H.m,H.z));
  C(S,tR+0.024,0.0095,vec(-0.16,-0.2,-0.28));
}
function tV(H){return vA(H.tax,H.tm,H.tz);}
/* um batimento completo */
function bt(S,tR,rr,H,o){
  o=o||{};var k=kf(rr)*(o.qt||H.qt||1),pr=o.pr!=null?o.pr:H.pr;
  if(!o.noP)pW(S,tR-pr+0.035,H,o.p);
  if(o.pq)C(S,tR-0.055,0.025,o.pq);
  (o.qrs||qN)(S,tR,H,o);
  if(o.j)C(S,tR+(o.jt||0.038),o.js||0.009,o.j);
  var tc=tR+(o.tOff!=null?o.tOff:0.21)*k;
  if(o.st)PL(S,tR+(o.st0||0.035),tc-(o.st1||0.01),o.st);
  if(o.stg)C(S,tR+(o.stc||0.1),o.stw||0.05,o.stg);
  if(!o.noT)C(S,tc,(o.tw||0.045)*Math.sqrt(k),o.tv||tV(H));
  if(o.t2)C(S,tc+(o.t2t||0.07),o.t2s||0.035,o.t2);
  if(o.u)C(S,tc+0.17,0.035,o.u);
  S.beats.push({tR:tR});
}
function run(S,H,hr,o,jit){
  var rr0=60/hr,t=rnd(0.3,0.6),j=jit==null?0.015:jit;
  while(t<S.dur+0.6){var r=rr0*(1+rnd(-j,j));bt(S,t,r,H,typeof o==="function"?o(t):o);t+=r;}
}

/* atividade atrial contínua */
function fibW(S,amp){var f=[rnd(5,6),rnd(6.5,7.8),rnd(8.3,9.6)],p=[rnd(0,6),rnd(0,6),rnd(0,6)],a=amp;
  W(S,function(t){var s=Math.sin(2*Math.PI*f[0]*t+p[0])+0.8*Math.sin(2*Math.PI*f[1]*t+p[1])+0.5*Math.sin(2*Math.PI*f[2]*t+p[2]);return vec(0.1*a*s,0.25*a*s,0.45*a*s);});}
function flutW(S,T0,off,amp){W(S,function(t){var ph=((t+off)%T0)/T0,s=ph<0.8?1-2*(ph/0.8):-1+2*((ph-0.8)/0.2);return vec(0.01*amp,0.2*amp*s,-0.09*amp*s);});}

/* desenho de uma ou mais derivações em faixas empilhadas (simulados e galeria) */
function stripRows(S){
  var rows=[],H=0;
  S.leads.forEach(function(L){
    var mx=0,mn=0,y=L.y,i;for(i=0;i<y.length;i++){if(y[i]>mx)mx=y[i];if(y[i]<mn)mn=y[i];}
    var top=Math.max(14,Math.ceil(Math.max(mx,1)*10+5)),bot=Math.max(8,Math.ceil(-mn*10+4));
    rows.push({L:L,y0:H+top,h:top+bot,top:H});H+=top+bot;
  });
  return {rows:rows,hmm:H};
}
function drawStrips(cv,S,o){
  var R=stripRows(S),wmm=10+S.dur*25,hmm=R.hmm,ppm=o.ppm;
  var W=wmm*ppm,H=hmm*ppm,dpr=capDpr(W,H);
  cv.style.width=W+"px";cv.style.height=H+"px";cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  var c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=PAPER.bg;c.fillRect(0,0,W,H);
  for(var pass=0;pass<2;pass++){
    c.strokeStyle=pass?PAPER.major:PAPER.minor;c.lineWidth=pass?1:0.5;c.beginPath();
    for(var i=0;i<=wmm;i++){if((i%5===0)!==!!pass)continue;var x=Math.round(i*ppm)+0.5;c.moveTo(x,0);c.lineTo(x,H);}
    for(var j=0;j<=hmm;j++){if((j%5===0)!==!!pass)continue;var yy=Math.round(j*ppm)+0.5;c.moveTo(0,yy);c.lineTo(W,yy);}
    c.stroke();
  }
  var lw=Math.min(2.6,Math.max(1.3,ppm*0.3));
  R.rows.forEach(function(r,ri){
    var y0=r.y0*ppm,yv=r.L.y;
    c.strokeStyle=PAPER.trace;c.lineWidth=lw;c.lineJoin="round";c.lineCap="round";
    c.beginPath();c.moveTo(1*ppm,y0);c.lineTo(2*ppm,y0);c.lineTo(2*ppm,y0-10*ppm);c.lineTo(7*ppm,y0-10*ppm);c.lineTo(7*ppm,y0);c.lineTo(9*ppm,y0);c.stroke();
    c.beginPath();
    for(var k=0;k<yv.length;k++){var px=(10+25*k/FS)*ppm,py=y0-yv[k]*10*ppm;if(k===0)c.moveTo(px,py);else c.lineTo(px,py);}
    c.stroke();
    c.fillStyle=PAPER.label;c.font="700 "+Math.max(11,Math.min(15,ppm*2.6))+"px Figtree,system-ui,sans-serif";c.textAlign="left";c.textBaseline="top";
    c.fillText(leadName(r.L.l),11*ppm,r.top*ppm+4);
  });
  c.fillStyle=PAPER.label;c.font="500 10px Figtree,system-ui,sans-serif";c.textAlign="right";c.textBaseline="alphabetic";
  c.fillText("25 mm/s · 10 mm/mV",W-8,H-5);
}

/* ---------- desenho em tira única ---------- */
var PAPER={bg:"#fff7f5",minor:"#f4c9c6",major:"#e39a98",trace:"#1b1414",label:"#a06a68",acc:"#c2153c"};
function draw(cv,S,o){
  var wmm=10+S.dur*25,hmm=o.hmm||32,ppm=o.ppm;
  var W=wmm*ppm,H=hmm*ppm,dpr=capDpr(W,H);
  cv.style.width=W+"px";cv.style.height=H+"px";cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  var c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=PAPER.bg;c.fillRect(0,0,W,H);
  var pass,i,j;
  for(pass=0;pass<2;pass++){
    c.strokeStyle=pass?PAPER.major:PAPER.minor;c.lineWidth=pass?1:0.5;c.beginPath();
    for(i=0;i<=wmm;i++){if((i%5===0)!==!!pass)continue;var x=Math.round(i*ppm)+0.5;c.moveTo(x,0);c.lineTo(x,H);}
    for(j=0;j<=hmm;j++){if((j%5===0)!==!!pass)continue;var yy=Math.round(j*ppm)+0.5;c.moveTo(0,yy);c.lineTo(W,yy);}
    c.stroke();
  }
  var y0=Math.round(hmm*0.6)*ppm;
  function X(tt){return (10+25*tt)*ppm;}
  function Y(v){return y0-v*10*ppm;}
  if(o.band){
    c.fillStyle="rgba(209,18,63,0.16)";c.fillRect(X(o.band.a),0,X(o.band.b)-X(o.band.a),H);
    c.strokeStyle=PAPER.acc;c.lineWidth=1.2;c.beginPath();c.moveTo(X(o.band.a),0);c.lineTo(X(o.band.a),H);c.moveTo(X(o.band.b),0);c.lineTo(X(o.band.b),H);c.stroke();
    if(o.band.label){c.fillStyle=PAPER.acc;c.font="700 12px Figtree,system-ui,sans-serif";c.textAlign="center";c.textBaseline="top";c.fillText(o.band.label,(X(o.band.a)+X(o.band.b))/2,6);}
  }
  c.strokeStyle=PAPER.trace;c.lineWidth=Math.min(2.6,Math.max(1.4,ppm*0.32));c.lineJoin="round";c.lineCap="round";
  c.beginPath();c.moveTo(1*ppm,y0);c.lineTo(2*ppm,y0);c.lineTo(2*ppm,y0-10*ppm);c.lineTo(7*ppm,y0-10*ppm);c.lineTo(7*ppm,y0);c.lineTo(9*ppm,y0);c.stroke();
  c.beginPath();var y=S.y;
  for(i=0;i<y.length;i++){var px=X(i/FS),py=Y(y[i]);if(i===0)c.moveTo(px,py);else c.lineTo(px,py);}
  c.stroke();
  c.fillStyle=PAPER.label;c.font="500 10px Figtree,system-ui,sans-serif";c.textAlign="left";c.textBaseline="alphabetic";
  c.fillText(leadName(o.lead||"II")+" · 25 mm/s · 10 mm/mV",12*ppm,H-6);
  if(o.markers){
    o.markers.forEach(function(m){
      var x=X(m.t);
      c.save();c.setLineDash([5,4]);c.strokeStyle=PAPER.acc;c.lineWidth=1.6;c.beginPath();c.moveTo(x,20);c.lineTo(x,H);c.stroke();c.restore();
      c.fillStyle=PAPER.acc;c.beginPath();c.arc(x,15,11,0,Math.PI*2);c.fill();
      c.fillStyle="#fff";c.font="700 12px Figtree,system-ui,sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(m.l,x,15.5);
    });
  }
}

function applyMode(){
  var b=visible(P.S);if(!b.length)return;
  var b1=b[Math.min(1,b.length-1)],b0=b[0];
  if(P.mode==="rr"){P.tA=b0.tR;P.tB=(b[1]||b0).tR;}
  else if(P.mode==="pr"){P.tA=b1.pOnset;P.tB=b1.qrsOn;}
  else if(P.mode==="qrs"){P.tA=b1.qrsOn;P.tB=b1.qrsOff;}
  renderPapel();
}
function renderPapel(){
  if(tab!=="aprender"||sub!=="papel"||!P.S)return;
  if(!ZP.render())return;
  var a=Math.min(P.tA,P.tB),b=Math.max(P.tA,P.tB),dt=b-a,mm=dt*25;
  var h="<b>"+fmt(mm,1)+" mm</b> = "+fmt(dt,2)+" s";
  if((P.mode==="rr"||P.mode===null)&&mm>2)h+='<span class="small">'+t("rd_rr",{mm:fmt(mm,0),bpm:Math.round(1500/Math.max(mm,1))})+"</span>";
  if(P.mode==="pr")h+='<span class="small">'+t(mm<3?"pr_short":mm>5?"pr_long":"pr_ok")+"</span>";
  if(P.mode==="qrs")h+='<span class="small">'+t(mm<3?"qrs_ok":"qrs_wide")+"</span>";

function renderGalList(){
  var box=$("galGroups"),h="";
  Object.keys(CATS).forEach(function(c){
    h+='<h3 class="galcat">'+L(CATS[c])+'</h3><div class="gallist">';
    GAL.filter(function(x){return x.cat===c;}).forEach(function(x){h+='<button class="galrow" data-g="'+x.id+'"><span>'+esc(L(x.name))+'</span><span class="tag f'+x.f+'">'+t("freq"+x.f)+"</span></button>";});
    h+="</div>";
  });
  box.innerHTML=h;
  box.querySelectorAll("[data-g]").forEach(function(b){b.addEventListener("click",function(){openGal(b.getAttribute("data-g"));});});
}
function openGal(id,seed){GD.id=id;GD.S=genItem(id,6,seed);$("galList").hidden=true;$("galDetail").hidden=false;window.scrollTo(0,0);ZG.reset();renderGal();}
function renderGal(){
  if(tab!=="aprender"||sub!=="achados")return;
  if(!GD.id){$("galList").hidden=false;$("galDetail").hidden=true;renderGalList();return;}
  var x=GBY[GD.id];
  $("gdName").textContent=L(x.name);
  $("gdTags").innerHTML='<span class="tag f'+x.f+'">'+t("freq"+x.f)+'</span><span class="tag">'+L(CATS[x.cat])+'</span><span class="tag">'+t(GD.S.leads.length>1?"gal_leads":"gal_lead",{l:GD.S.leads.map(function(z){return leadName(z.l);}).join(", ")})+"</span>";
  $("gdWhat").textContent=L(x.what);
  $("gdCrit").innerHTML=L(x.crit).map(function(c){return "<li>"+esc(c)+"</li>";}).join("");
  $("gdClin").textContent=L(x.clin);
  ZG.render();
  $("gdPrev").disabled=x.i===0;$("gdNext").disabled=x.i===GAL.length-1;
}
$("galBack").addEventListener("click",function(){GD.id=null;renderGal();window.scrollTo(0,0);});
$("gdAgain").addEventListener("click",function(){GD.S=genItem(GD.id,6);renderGal();});
$("gdPrev").addEventListener("click",function(){var x=GBY[GD.id];if(x.i>0)openGal(GAL[x.i-1].id);});
$("gdNext").addEventListener("click",function(){var x=GBY[GD.id];if(x.i<GAL.length-1)openGal(GAL[x.i+1].id);});

/* ---------- SIMULADOS ---------- */
var stats=(function(){try{var s=JSON.parse(localStorage.getItem("ecglab:sim2"));if(s&&typeof s.total==="number"&&s.wrong)return s;}catch(e){}return {total:0,ok:0,wrong:{}};})(),q=null,streak=0;
function saveStats(){try{localStorage.setItem("ecglab:sim2",JSON.stringify(stats));}catch(e){}}
var QHIST=[],FW={1:4,2:2,3:1};
function nextKey(){
  var keys=GAL.map(function(x){return x.id;}),recent=QHIST.slice(-6);
  var w=keys.map(function(k){return recent.indexOf(k)>=0?0:FW[GBY[k].f||2]*(1+2*(stats.wrong[k]||0));});
  var sum=w.reduce(function(a,b){return a+b;},0),r=Math.random()*sum;
  for(var i=0;i<keys.length;i++){r-=w[i];if(r<=0)return keys[i];}
  return keys[0];
}
function newQ(){
  var key=nextKey(),x=GBY[key],S=genItem(key,6);QHIST.push(key);if(QHIST.length>20)QHIST.shift();
  var opts=[key],sim=shuffle(x.sim||[]).filter(function(k){return GBY[k];});opts=opts.concat(sim.slice(0,2));
  var same=shuffle(GAL.filter(function(y){return y.cat===x.cat&&opts.indexOf(y.id)<0;}).map(function(y){return y.id;}));if(opts.length<4&&same.length)opts.push(same[0]);
  var rest=shuffle(GAL.map(function(y){return y.id;}).filter(function(k){return opts.indexOf(k)<0;}));
  while(opts.length<4)opts.push(rest.pop());
  q={key:key,S:S,opts:shuffle(opts),answered:false,chosen:null};
  ZQ.reset();drawQuiz();$("dica").hidden=true;$("btnDica").hidden=false;
  renderQuiz();
}
function drawQuiz(){if(q&&tab==="quiz")ZQ.render();}
function renderQuiz(){
  if(!q)return;
  $("btnDica").textContent=t($("dica").hidden?"guide_show":"guide_hide");
  var box=$("opts");box.innerHTML="";
  q.opts.forEach(function(k,i){
    var b=document.createElement("button");b.className="opt";
    b.innerHTML='<span class="l">'+LET[i]+'.</span><span></span>';b.lastChild.textContent=L(GBY[k].name);
    if(q.answered){b.disabled=true;if(k===q.key)b.classList.add("correct");else if(k===q.chosen)b.classList.add("wrong");else b.classList.add("dim");}
    else b.addEventListener("click",function(){answerQ(k);});
    box.appendChild(b);
  });
  var fb=$("fb");
  if(q.answered){
    var x=GBY[q.key],ok=q.chosen===q.key,bts=visible(q.S),fc="";
    if(bts.length>=2&&["vf"].indexOf(q.key)<0){var hr=(bts.length-1)*60/(bts[bts.length-1].tR-bts[0].tR);fc='<p class="fc">'+t("hr_est",{n:Math.round(hr)})+"</p>";}
    fb.className="fb card "+(ok?"ok":"no");
    fb.innerHTML="<h3>"+(ok?t("correct")+" ":t("was")+" ")+esc(L(x.name))+'</h3><p style="font-size:15px;margin-bottom:8px">'+esc(L(x.what))+"</p><ul>"+L(x.crit).map(function(c){return "<li>"+esc(c)+"</li>";}).join("")+'</ul><p class="fc">'+esc(L(x.clin))+"</p>"+fc+
      '<button class="btn primary" id="btnNext" style="width:100%">'+t("next_ecg")+"</button>"+'<button class="linkbtn report" id="btnReport">'+t("rep_sim")+"</button>";
    fb.hidden=false;$("btnDica").hidden=true;$("dica").hidden=true;
    $("btnNext").addEventListener("click",newQ);$("btnReport").addEventListener("click",function(){reportSim(q.S,q.chosen);});
  }else fb.hidden=true;
  renderStats();
}
function answerQ(k){
  q.answered=true;q.chosen=k;var ok=(k===q.key);
  stats.total++;if(ok){stats.ok++;streak++;}else{stats.wrong[q.key]=(stats.wrong[q.key]||0)+1;streak=0;}
  saveStats();renderQuiz();$("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function renderStats(){
  var pct=stats.total?Math.round(100*stats.ok/stats.total):0;
  $("statText").innerHTML=t("hits")+": <b>"+stats.ok+"/"+stats.total+"</b>"+(stats.total?" ("+pct+"%)":"");
  $("streakText").innerHTML=streak>1?t("streak")+": <b>"+streak+"</b>":"";
  var w=Object.keys(stats.wrong).filter(function(k){return GBY[k]&&stats.wrong[k]>0;}).sort(function(a,b){return stats.wrong[b]-stats.wrong[a];}).slice(0,3);
  $("weak").textContent=w.length?t("review",{list:w.map(function(k){return L(GBY[k].name)+" ("+stats.wrong[k]+")";}).join(", ")}):"";
}
$("btnDica").addEventListener("click",function(){var d=$("dica");d.hidden=!d.hidden;$("btnDica").textContent=t(d.hidden?"guide_show":"guide_hide");});
$("btnZerar").addEventListener("click",function(){stats={total:0,ok:0,wrong:{}};streak=0;saveStats();renderStats();});

/* ---- importação do PTB-XL ---- */
function parseCSV(text){
  var rows=[],row=[],f="",qt=false,i=0,n=text.length;
  while(i<n){var ch=text[i];
    if(qt){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else qt=false;}else f+=ch;}
    else if(ch==='"')qt=true;
    else if(ch===","){row.push(f);f="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";rows.push(row);row=[];}
    else f+=ch;
    i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
function parseCodes(s){var o={},re=/'([^']+)':\s*([\d.]+)/g,m;while((m=re.exec(s)))o[m[1]]=parseFloat(m[2]);return o;}
function progress(p,txt){$("rProgWrap").hidden=false;$("rProg").style.width=Math.round(p*100)+"%";$("rProgTxt").textContent=txt;}
function parseHea(txt){
  var ln=txt.split(/\r?\n/).filter(function(l){return l&&l[0]!=="#";});
  var h=ln[0].trim().split(/\s+/),nsig=+h[1],fs=parseFloat(h[2]),gains=[],base=[];
  for(var i=1;i<=nsig;i++){var p=(ln[i]||"").trim().split(/\s+/),gm=/^([\d.]+)(?:\((-?\d+)\))?/.exec(p[2]||"1000");gains.push(gm?parseFloat(gm[1])||1000:1000);base.push(gm&&gm[2]?+gm[2]:0);}
  return {nsig:nsig,fs:fs,gains:gains,base:base};
}
function ImportErr(k){this.message=t(k);}
$("rImport").addEventListener("change",function(){
  var files=Array.prototype.slice.call(this.files||[]);this.value="";
  if(!files.length)return;
  importPTBXL(files).catch(function(e){console.error(e);progress(0,t("prog_err",{e:e&&e.message?e.message:e}));});
});
function importPTBXL(files){
  var csv=null,map={};
  files.forEach(function(f){
    var p=(f.webkitRelativePath||f.name).replace(/\\/g,"/");
    if(/(^|\/)ptbxl_database\.csv$/.test(p))csv=f;
    var m=/(?:^|\/)(\d{5}_(lr|hr))\.(dat|hea)$/.exec(p);
    if(m){(map[m[1]]=map[m[1]]||{})[m[3]]=f;}
  });
  if(!csv)return Promise.reject(new ImportErr("err_csv"));
  if(!Object.keys(map).length)return Promise.reject(new ImportErr("err_rec"));
  progress(0.02,t("prog_csv"));
  return csv.text().then(function(text){
    var rows=parseCSV(text),hd=rows[0],col={};hd.forEach(function(h,i){col[h.trim()]=i;});
    ["ecg_id","scp_codes","filename_lr","filename_hr"].forEach(function(k){if(!(k in col))throw new Error("CSV: "+k);});
    var byL={};
    for(var r=1;r<rows.length;r++){
      var R0=rows[r];if(R0.length<hd.length-2)continue;
      var codes=parseCodes(R0[col.scp_codes]),Lb=primaryLabel(codes);if(!Lb)continue;
      var hr=String(R0[col.filename_hr]||"").split("/").pop(),lr=String(R0[col.filename_lr]||"").split("/").pop();
      var key=(map[hr]&&map[hr].dat&&map[hr].dat.size>=0.95*120000)?hr:((map[lr]&&map[lr].dat&&map[lr].dat.size>=0.95*24000)?lr:null);
      if(!key)continue;
      var val=String(R0[col.validated_by_human]||"").toLowerCase()==="true";
      var bad=[col.electrodes_problems,col.burst_noise].some(function(c){return c!=null&&R0[c]&&R0[c].trim();});
      (byL[Lb]=byL[Lb]||[]).push({id:+R0[col.ecg_id],label:Lb,codes:codes,key:key,validated:val,bad:bad,
        age:parseFloat(R0[col.age]),sex:col.sex!=null?parseInt(R0[col.sex],10):null,axis:col.heart_axis!=null?R0[col.heart_axis]:"",report:col.report!=null?R0[col.report]:""});
    }
    var PER=30,sel=[];
    Object.keys(byL).forEach(function(k){var a=shuffle(byL[k]).sort(function(x,y){return (y.validated-x.validated)||(x.bad-y.bad);});sel=sel.concat(a.slice(0,PER));});
    if(!sel.length)throw new ImportErr("err_none");
    var done=0,metas=[],sigs=[],i=0;
    function flush(){var m=metas,s=sigs;metas=[];sigs=[];return putMany("sig",s).then(function(){return putMany("meta",m);});}
    function step(){
      if(i>=sel.length)return flush();
      var it=sel[i++],fp=map[it.key];
      var hp=fp.hea?fp.hea.text():Promise.resolve(null);
      return Promise.all([hp,fp.dat.arrayBuffer()]).then(function(res){
        var H=res[0]?parseHea(res[0]):{nsig:12,fs:/_hr$/.test(it.key)?500:100,gains:[],base:[]};
        if(H.nsig!==12)return;
        var dv=new DataView(res[1]),n=Math.floor(res[1].byteLength/24),fs=H.fs,dec=fs>=500?2:1,nn=Math.floor(n/dec),out=new Int16Array(12*nn);
        for(var k=0;k<12;k++){
          var gn=H.gains[k]||1000,b=H.base[k]||0,sc=1000/gn;
          for(var j=0;j<nn;j++){var acc=0;for(var d=0;d<dec;d++){acc+=dv.getInt16(((j*dec+d)*12+k)*2,true)-b;}var v=Math.round(acc/dec*sc);out[k*nn+j]=v>32767?32767:v<-32768?-32768:v;}
        }
        sigs.push({id:it.id,fs:fs/dec,n:nn,data:out});
        metas.push({id:it.id,label:it.label,codes:it.codes,validated:it.validated,age:it.age,sex:it.sex,axis:it.axis,report:it.report});
      }).then(function(){
        done++;
        if(done%10===0||done===sel.length)progress(0.05+0.95*done/sel.length,t("prog_n",{a:done,b:sel.length}));
        if(metas.length>=40)return flush().then(step);
        return step();
      });
    }
    return step().then(loadBank).then(function(){
      progress(1,t("prog_done",{n:RS.bank.length}));
      RS.src="bank";renderSrcBar();renderBankInfo();startSession();
    });
  });
}
function loadBank(){return tx("meta","readonly",function(s){return s.getAll();}).then(function(a){RS.bank=a||[];}).catch(function(){RS.bank=[];});}
$("rClear").addEventListener("click",function(){
  Promise.all([tx("meta","readwrite",function(s){s.clear();}),tx("sig","readwrite",function(s){s.clear();})]).then(function(){
    try{localStorage.removeItem("ecglab:pack");}catch(e){}RS.bank=[];RS.src="demo";$("rProgWrap").hidden=true;renderSrcBar();renderBankInfo();startSession();
  }).catch(function(e){console.error(e);});
});

function loadJSZip(){
  if(window.JSZip)return Promise.resolve(window.JSZip);
  return new Promise(function(res,rej){var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=function(){res(window.JSZip);};s.onerror=function(){rej(new Error("JSZip"));};document.head.appendChild(s);});
}
function exportPack(){
  var per=+$("rPer").value,byL={};
  RS.bank.forEach(function(m){(byL[m.label]=byL[m.label]||[]).push(m);});
  var sel=[];Object.keys(byL).forEach(function(k){sel=sel.concat(shuffle(byL[k]).sort(function(a,b){return (b.validated?1:0)-(a.validated?1:0);}).slice(0,per));});
  var sigs=[],i=0;
  $("rExport").disabled=true;
  function next(){
    if(i>=sel.length)return Promise.resolve();
    var m=sel[i++];
    return tx("sig","readonly",function(s){return s.get(m.id);}).then(function(S){if(S)sigs.push({m:m,S:S});if(i%10===0)progress(0.9*i/sel.length,t("exporting",{a:i,b:sel.length}));return next();});
  }
  return next().then(function(){
    var total=0;sigs.forEach(function(x){total+=x.S.data.length;});
    var buf=new Int16Array(total),pos=0,cases=[];
    sigs.forEach(function(x){
      var S=x.S,n=S.n,m=x.m;
      for(var k=0;k<12;k++){var prev=0;for(var j=0;j<n;j++){var v=S.data[k*n+j];buf[pos++]=v-prev;prev=v;}}
      cases.push({id:m.id,label:m.label,codes:m.codes,validated:m.validated,age:m.age,sex:m.sex,axis:m.axis,report:m.report,fs:S.fs,n:n});
    });
    return loadJSZip().then(function(JSZip){
      var zip=new JSZip();
      zip.file("ecglab-pack.json",JSON.stringify({format:"ecglab-pack",v:1,source:"PTB-XL 1.0.3 (CC BY 4.0)",encoding:"int16 LE, microvolts, per-lead delta, lead-major",leads:LEADS12,cases:cases}));
      zip.file("signals.bin",buf.buffer);
      return zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:9}});
    }).then(function(blob){
      var mb=fmt(blob.size/1048576,1),name="ecglab-ptbxl-"+cases.length+".zip";
      progress(1,t("export_done",{n:cases.length,mb:mb}));
      var cu=window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null);
      return cu.then(function(dl){
        if(dl)return dl.save({filename:name,data:blob}).catch(function(e){if(e&&e.code!=="declined")progress(1,t("export_fail"));});
        var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
      });
    });
  }).catch(function(e){console.error(e);progress(0,t("export_fail"));}).then(function(){$("rExport").disabled=false;});
}
function storePack(meta,d){
  var pos=0,sigs=[],metas=[];
  meta.cases.forEach(function(c){
    var n=c.n,out=new Int16Array(12*n);
    for(var k=0;k<12;k++){var acc=0;for(var j=0;j<n;j++){acc=(acc+d[pos++])<<16>>16;out[k*n+j]=acc;}}
    sigs.push({id:c.id,fs:c.fs,n:n,data:out});
    metas.push({id:c.id,label:c.label,codes:c.codes,validated:c.validated,age:c.age,sex:c.sex,axis:c.axis,axdeg:c.axdeg!=null?c.axdeg:null,report:c.report});
  });
  return putMany("sig",sigs).then(function(){return putMany("meta",metas);});
}
function importPack(file){
  progress(0.05,t("pack_read"));
  return loadJSZip().then(function(JSZip){return JSZip.loadAsync(file);}).then(function(zip){
    var jf=zip.file("ecglab-pack.json"),bf=zip.file("signals.bin");
    if(!jf||!bf)throw new ImportErr("pack_bad");
    return Promise.all([jf.async("string"),bf.async("arraybuffer")]);
  }).then(function(r){
    var meta=JSON.parse(r[0]);if(meta.format!=="ecglab-pack"||!meta.cases)throw new ImportErr("pack_bad");
    progress(0.8,t("prog_n",{a:meta.cases.length,b:meta.cases.length}));
    return storePack(meta,new Int16Array(r[1]));
  }).then(loadBank).then(function(){
    progress(1,t("prog_done",{n:RS.bank.length}));
    RS.src="bank";renderSrcBar();renderBankInfo();startSession();
  });
}
$("rImportPack").addEventListener("change",function(){
  var f=this.files&&this.files[0];this.value="";if(!f)return;
  importPack(f).catch(function(e){console.error(e);progress(0,t("prog_err",{e:e&&e.message?e.message:e}));});
});
$("rExport").addEventListener("click",exportPack);

/* ---------- zoom dentro da área, com arrastar e pinça ---------- */
function capDpr(W,H){var d=Math.min(window.devicePixelRatio||1,3),mx=16e6;if(W*H*d*d>mx)d=Math.max(0.5,Math.sqrt(mx/(W*H)));return d;}
function ZoomView(o){
  var w=o.wrap,z={v:0,ppm:0,base:0},ptrs={},pan=null,pinch=null,owned=false;
  w.classList.add("zview");
  function mxOf(b){return Math.max(b*1.5,o.max(b));}
  function vOf(ppm){var b=z.base,m=mxOf(b);return 100*Math.log(ppm/b)/Math.log(m/b);}
  z.pannable=function(){return z.v>0.5||w.scrollWidth>w.clientWidth+2;};
  z.render=function(){
    if(w.clientWidth<50)return false;
    var b=o.base(w.clientWidth);if(!b||b<=0)return false;
    z.base=b;z.ppm=b*Math.pow(mxOf(b)/b,z.v/100);
    o.draw(z.ppm);
    var ch=parseFloat(o.cv.style.height)||o.cv.offsetHeight;
    w.style.height=(Math.round(ch*b/z.ppm)+2)+"px";
    w.classList.toggle("zoomed",z.v>0.5);
    w.classList.toggle("pannable",z.pannable());
    w.style.touchAction=z.v>0.5?"none":"pan-y";
    if(o.slider)o.slider.value=z.v;
    return true;
  };
  z.set=function(v,ax,ay){
    if(!z.ppm&&!z.render())return;
    if(ax==null){ax=w.clientWidth/2;ay=w.clientHeight/2;}
    var old=z.ppm,ux=(w.scrollLeft+ax)/old,uy=(w.scrollTop+ay)/old;
    z.v=Math.max(0,Math.min(100,v));
    if(!z.render())return;
    w.scrollLeft=ux*z.ppm-ax;w.scrollTop=uy*z.ppm-ay;
  };
  z.reset=function(){z.v=0;w.scrollLeft=0;w.scrollTop=0;if(o.slider)o.slider.value=0;};
  function rel(x,y){var r=w.getBoundingClientRect();return {x:x-r.left-1,y:y-r.top-1};}
  function two(){var ids=Object.keys(ptrs);if(ids.length<2)return null;var a=ptrs[ids[0]],b=ptrs[ids[1]];return {d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  w.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse"&&e.button!==0)return;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    try{w.setPointerCapture(e.pointerId);}catch(x){}
    var p=two();
    if(p){if(owned&&o.up)o.up();owned=false;pan=null;pinch={d:p.d,ppm:z.ppm,x:p.x,y:p.y};return;}
    if(o.grab&&o.grab(e,z)){owned=true;e.preventDefault();return;}
    pan={x:e.clientX,y:e.clientY};w.classList.add("grabbing");
  });
  w.addEventListener("pointermove",function(e){
    if(!ptrs[e.pointerId])return;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(pinch){var p=two();if(!p)return;var a=rel(p.x,p.y);
      w.scrollLeft-=p.x-pinch.x;w.scrollTop-=p.y-pinch.y;pinch.x=p.x;pinch.y=p.y;
      z.set(vOf(pinch.ppm*p.d/pinch.d),a.x,a.y);e.preventDefault();return;}
    if(owned){if(o.move)o.move(e,z);e.preventDefault();return;}
    if(pan){w.scrollLeft-=e.clientX-pan.x;w.scrollTop-=e.clientY-pan.y;pan={x:e.clientX,y:e.clientY};}
  });
  function up(e){
    delete ptrs[e.pointerId];
    if(owned){owned=false;if(o.up)o.up(e,z);}
    var ids=Object.keys(ptrs);
    if(ids.length<2)pinch=null;
    if(ids.length===1){var q2=ptrs[ids[0]];pan={x:q2.x,y:q2.y};}
    if(!ids.length){pan=null;w.classList.remove("grabbing");}
  }
  w.addEventListener("pointerup",up);w.addEventListener("pointercancel",up);
  w.addEventListener("dblclick",function(e){var a=rel(e.clientX,e.clientY);z.set(z.v>30?0:60,a.x,a.y);});
  w.addEventListener("wheel",function(e){
    var k=e.deltaMode===1?16:e.deltaMode===2?w.clientHeight:1;
    if(e.ctrlKey){e.preventDefault();var a=rel(e.clientX,e.clientY);z.set(vOf(z.ppm*Math.exp(-e.deltaY*k*0.01)),a.x,a.y);return;}
    if(!z.pannable())return;
    var dx=e.deltaX*k,dy=e.deltaY*k;if(e.shiftKey&&!dx){dx=dy;dy=0;}
    var sl=w.scrollLeft,st=w.scrollTop;
    w.scrollLeft+=dx;if(z.v>0.5)w.scrollTop+=dy;
    if(w.scrollLeft!==sl||w.scrollTop!==st)e.preventDefault();
  },{passive:false});
  if(o.slider)o.slider.addEventListener("input",function(){z.set(+this.value);});
  if(o.zin)o.zin.addEventListener("click",function(){z.set(z.v+20);});
  if(o.zout)o.zout.addEventListener("click",function(){z.set(z.v-20);});
  return z;
}
function tAt(cv,e,dur){var r=cv.getBoundingClientRect(),ppm=r.width/(10+dur*25);return {t:Math.max(0,Math.min(dur,(((e.clientX-r.left)/ppm)-10)/25)),ppm:ppm};}
ZP=ZoomView({wrap:$("papelWrap"),cv:$("cvPapel"),slider:$("zPapel"),zin:$("zPapelIn"),zout:$("zPapelOut"),
  base:function(w){return w/(10+3*25);},max:function(b){return Math.max(b*4,16);},
  draw:function(ppm){var a=Math.min(P.tA,P.tB),b=Math.max(P.tA,P.tB);draw($("cvPapel"),P.S,{ppm:ppm,hmm:32,markers:[{t:P.tA,l:"A"},{t:P.tB,l:"B"}],band:{a:a,b:b,label:fmt((b-a)*25,1)+" mm"}});},
  grab:function(e,z){
    if(!P.S)return false;var h=tAt($("cvPapel"),e,P.S.dur),x=h.t,near=Math.min(Math.abs(x-P.tA),Math.abs(x-P.tB))*25*h.ppm;
    if(z.pannable()&&near>30)return false;
    P.drag=Math.abs(x-P.tA)<=Math.abs(x-P.tB)?"A":"B";if(P.drag==="A")P.tA=x;else P.tB=x;P.mode=null;renderPapel();return true;},
  move:function(e){if(!P.drag)return;var x=tAt($("cvPapel"),e,P.S.dur).t;if(P.drag==="A")P.tA=x;else P.tB=x;renderPapel();},
  up:function(){P.drag=null;}});
ZN=ZoomView({wrap:$("normalWrap"),cv:$("cvNormal"),slider:$("zNormal"),zin:$("zNormalIn"),zout:$("zNormalOut"),
  base:function(w){return w/(10+2.6*25);},max:function(b){return Math.max(b*4,16);},
  draw:function(ppm){var bts=visible(N.S),b=bts[1]||bts[0],p=PARTS[N.sel],r=p.reg(b);draw($("cvNormal"),N.S,{ppm:ppm,hmm:32,band:{a:r[0],b:r[1],label:L(p.chip)}});}});
ZG=ZoomView({wrap:$("gdScroll"),cv:$("cvGal"),slider:$("zGal"),zin:$("zGalIn"),zout:$("zGalOut"),
  base:function(){return 4.5;},max:function(){return 16;},
  draw:function(ppm){drawStrips($("cvGal"),GD.S,{ppm:ppm});}});
ZQ=ZoomView({wrap:$("quizScroll"),cv:$("cvQuiz"),slider:$("zQuiz"),zin:$("zQuizIn"),zout:$("zQuizOut"),
  base:function(){return 5;},max:function(){return 16;},
  draw:function(ppm){drawStrips($("cvQuiz"),q.S,{ppm:ppm});}});
ZR=ZoomView({wrap:$("rScroll"),cv:$("cvReal"),slider:$("rZoom"),zin:$("rZoomIn"),zout:$("rZoomOut"),
  base:function(w){return fitPpmOf(RS.cur.C,w-2);},max:function(b){return Math.max(b*2.5,12);},
  draw:function(ppm){RS.ppm=ppm;RS.dur=drawMulti($("cvReal"),RS.cur.C,ppm,markers());},
  grab:function(e){if(!RS.measure||!RS.cur)return false;placeMarker(tAt($("cvReal"),e,RS.dur||10).t,true);drawReal();return true;},
  move:function(e){if(!RS.drag)return;placeMarker(tAt($("cvReal"),e,RS.dur||10).t);drawReal();},
  up:function(){RS.drag=null;}});

/* ---------- casos reais embutidos (data/ptbxl.js) ---------- */
var PACK_V="ptbxl-281-v2",PACK_SRC="data/ptbxl.js";
function packBytes(s){var bin=atob(s),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return u;}
function packInflate(u8){
  if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("DecompressionStream"));
  return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
}
function packPlanes(ab){var u=new Uint8Array(ab),n=u.length>>1,d=new Int16Array(n);for(var i=0;i<n;i++)d[i]=(u[i]|(u[n+i]<<8))<<16>>16;return d;}
function autoPack(){
  var have=null;try{have=localStorage.getItem("ecglab:pack");}catch(e){}
  if(have===PACK_V&&RS.bank.length)return Promise.resolve(false);
  if(!RS.bank.length)$("bankInfo").textContent=t("pack_loading");
  return new Promise(function(res,rej){
    if(window.ECGLAB_PACK)return res(window.ECGLAB_PACK);
    var s=document.createElement("script");s.src=PACK_SRC+"?"+PACK_V;s.async=true;
    s.onload=function(){if(window.ECGLAB_PACK)res(window.ECGLAB_PACK);else rej(new Error("pack"));};
    s.onerror=function(){rej(new Error("sem data/ptbxl.js"));};
    document.head.appendChild(s);
  }).then(function(P2){
    var wipe=have?Promise.all([tx("meta","readwrite",function(s){s.clear();}),tx("sig","readwrite",function(s){s.clear();})]):Promise.resolve();
    return wipe.then(function(){return packInflate(packBytes(P2.sig));}).then(function(ab){return storePack(P2,packPlanes(ab));});
  }).then(function(){
    try{localStorage.setItem("ecglab:pack",PACK_V);}catch(e){}
    try{delete window.ECGLAB_PACK;}catch(e){window.ECGLAB_PACK=null;}
    return true;
  });
}


/* ---------- reportar erro (Google Forms pré-preenchido) e links que reabrem o caso ---------- */
var APP_V="2026-10-01";
var REPORT={url:"https://docs.google.com/forms/d/e/1FAIpQLSfpAkurZKNCXO5wx5_XI8l106OqjC3oRtqgpL9tOg27yvqjqA/viewform",f:{sec:"entry.172935300",item:"entry.1063208790",det:"entry.1116867491",link:"entry.1185269790"}};   // formulário "ECG Lab - Reportar erro"
function siteURL(){return /^https?:/.test(location.protocol)?location.origin+location.pathname:"https://italoneri.github.io/ecg-lab/";}
function openReport(sec,item,det,link){
  if(!REPORT.url){alert(t("rep_off"));return;}
  var u=REPORT.url+(REPORT.url.indexOf("?")<0?"?":"&")+"usp=pp_url",f=REPORT.f;
  [[f.sec,sec],[f.item,item],[f.det,det],[f.link,link]].forEach(function(p){if(p[0])u+="&"+p[0]+"="+encodeURIComponent(p[1]||"");});
  window.open(u,"_blank","noopener");
}
function reportSim(S,chosen){
  if(!S||!S.id)return;var x=GBY[S.id],leads=S.leads.map(function(z){return leadName(z.l);}).join(", ");
  var det=[t("rep_ans")+": "+L(x.name)];if(chosen)det.push(t("rep_mark")+": "+L(GBY[chosen].name));
  det.push(t("rep_leads")+": "+leads,"lang: "+LANG,"v: "+APP_V);
  openReport(tab==="quiz"?"Simulados":"Aprender > Achados",S.id+" — "+L(x.name),det.join(" | "),siteURL()+"#sim="+S.id+"."+S.seed);
}
function reportReal(){
  var qq=RS.cur;if(!qq)return;var tx2=qq.text(),okI=qq.keys.findIndex(function(k,i){return qq.isOk(i);});
  var det=[tx2.prompt,t("rep_ans")+": "+qq.optText(qq.keys[okI])];
  if(qq.answered&&qq.chosen!=null)det.push(t("rep_mark")+": "+qq.optText(qq.keys[qq.chosen]));
  if(tx2.laudo&&tx2.laudo.length)det.push(t("laudo_short")+": "+tx2.laudo.join("; ").replace(/<[^>]+>/g,""));
  det.push("lang: "+LANG,"v: "+APP_V);
  var isBank=typeof qq.id==="number";
  openReport("Casos reais",(isBank?"PTB-XL ":"")+qq.id,det.join(" | "),isBank?siteURL()+"#caso="+qq.id:siteURL());
}
$("gdReport").addEventListener("click",function(){reportSim(GD.S,null);});
$("rReport").addEventListener("click",reportReal);
function applyHash(){
  var h=decodeURIComponent(location.hash.slice(1));if(!h)return;
  var m=/^sim=([a-z0-9_]+)\.(\d+)$/.exec(h);
  if(m&&GBY[m[1]]){setTab("aprender");setSub("achados");openGal(m[1],+m[2]);return;}
  m=/^caso=(\d+)$/.exec(h);
  if(m){var id=+m[1];if(RS.bank.some(function(b){return b.id===id;})){setTab("reais");RS.src="bank";RS.force=id;renderSrcBar();startSession();}}
}
window.addEventListener("hashchange",applyHash);

/* ---------- início ---------- */
newPapel();newNormal();newQ();
applyLang();setSub("papel");
loadBank().then(function(){
  if(RS.bank.length)RS.src="bank";renderSrcBar();renderBankInfo();startSession();
  return autoPack().then(function(did){
    if(!did)return;
    return loadBank().then(function(){
      var fresh=RS.src==="demo"&&RS.sess&&RS.sess.i===0&&!(RS.cur&&RS.cur.answered)&&!RS.full;
      if(fresh)RS.src="bank";
      renderSrcBar();renderBankInfo();if(fresh)startSession();
    });
  }).then(applyHash,applyHash);
}).catch(function(e){console.warn("ECG Lab:",e&&e.message?e.message:e);renderBankInfo();});

})();
